server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/todo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # password: 如果本地 Redis 没设密码，这行注释掉
      database: 0
      timeout: 2s                          # 命令超时，默认可能很长
      connect-timeout: 2s                  # 连接超时
      lettuce:
        shutdown-timeout: 100ms
jwt:
  secret: aaabbbcccdddeeefffggghhhiiijjjkk
  expiration: 86400000

# MyBatis-Plus ???????SQL?
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true
  openapi:
    title: 待办管理系统 API
    description: 支持用户注册登录、JWT认证、待办CRUD
    version: 1.0.0